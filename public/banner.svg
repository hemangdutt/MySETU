<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8f2" />
      <stop offset="30%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f2faf4" />
    </linearGradient>

    <!-- Saffron Wave Gradient -->
    <linearGradient id="saffronWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#fb923c" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#fdba74" stop-opacity="0.2" />
    </linearGradient>

    <!-- Green Wave Gradient -->
    <linearGradient id="greenWave" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#16a34a" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#22c55e" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#86efac" stop-opacity="0.1" />
    </linearGradient>

    <!-- White Wave Gradient -->
    <linearGradient id="whiteWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- 1. Canvas Base -->
  <rect width="1500" height="500" fill="url(#bgGrad)" />

  <!-- Watercolor wash textures -->
  <circle cx="150" cy="180" r="280" fill="#fed7aa" opacity="0.25" filter="blur(40px)" />
  <circle cx="1350" cy="350" r="280" fill="#bbf7d0" opacity="0.25" filter="blur(40px)" />

  <!-- 2. Saffron Ribbon Waves (Top-Left across to Top-Right) -->
  <path d="M 0 0 L 600 0 C 480 80 320 140 180 130 C 80 120 20 70 0 40 Z" fill="url(#saffronWave)" />
  <path d="M 0 0 L 850 0 C 680 70 450 110 260 90 C 120 70 40 40 0 20 Z" fill="#f97316" opacity="0.5" />
  <path d="M 0 40 Q 220 150 480 80 T 900 30 Q 1100 0 1500 0 L 1500 0 L 0 0 Z" fill="#ffedd5" opacity="0.4" />

  <!-- 3. Green Ribbon Waves (Bottom-Left sweeping across to Bottom-Right) -->
  <path d="M 0 450 C 180 430 380 480 550 460 C 800 430 1100 360 1500 380 L 1500 500 L 0 500 Z" fill="url(#greenWave)" />
  <path d="M 0 480 C 220 440 450 470 700 440 C 950 410 1250 370 1500 410 L 1500 500 L 0 500 Z" fill="#15803d" opacity="0.4" />

  <!-- 4. Parliament House of India (Left Background) -->
  <g transform="translate(10, 80) scale(0.65)" opacity="0.85">
    <!-- Parliament Colonnade -->
    <path d="M 20 280 L 320 280 L 320 220 L 20 220 Z" fill="#ea580c" opacity="0.15" />
    <ellipse cx="170" cy="220" rx="150" ry="25" fill="#f97316" opacity="0.25" />
    <!-- Pillars -->
    <line x1="40" y1="220" x2="40" y2="280" stroke="#c2410c" stroke-width="4" opacity="0.4" />
    <line x1="70" y1="220" x2="70" y2="280" stroke="#c2410c" stroke-width="4" opacity="0.4" />
    <line x1="100" y1="220" x2="100" y2="280" stroke="#c2410c" stroke-width="4" opacity="0.4" />
    <line x1="130" y1="220" x2="130" y2="280" stroke="#c2410c" stroke-width="4" opacity="0.4" />
    <line x1="160" y1="220" x2="160" y2="280" stroke="#c2410c" stroke-width="4" opacity="0.4" />
    <line x1="190" y1="220" x2="190" y2="280" stroke="#c2410c" stroke-width="4" opacity="0.4" />
    <line x1="220" y1="220" x2="220" y2="280" stroke="#c2410c" stroke-width="4" opacity="0.4" />
    <line x1="250" y1="220" x2="250" y2="280" stroke="#c2410c" stroke-width="4" opacity="0.4" />
    <line x1="280" y1="220" x2="280" y2="280" stroke="#c2410c" stroke-width="4" opacity="0.4" />
    <line x1="300" y1="220" x2="300" y2="280" stroke="#c2410c" stroke-width="4" opacity="0.4" />
    <!-- Central Dome -->
    <path d="M 120 220 Q 170 140 220 220 Z" fill="#ea580c" opacity="0.3" />
    <!-- Flagpole & Indian Flag atop Parliament -->
    <line x1="170" y1="140" x2="170" y2="70" stroke="#334155" stroke-width="2.5" />
    <rect x="170" y="70" width="35" height="7" fill="#ea580c" />
    <rect x="170" y="77" width="35" height="7" fill="#ffffff" />
    <circle cx="187.5" cy="80.5" r="2.5" fill="#0A3A60" />
    <rect x="170" y="84" width="35" height="7" fill="#15803d" />
  </g>

  <!-- 5. Hon. Prime Minister Narendra Modi (Left Foreground Portrait) -->
  <g transform="translate(40, 100) scale(0.92)">
    <!-- Body: Kurta & Beige Jacket -->
    <path d="M 80 400 L 40 330 C 50 280 90 260 130 260 C 170 260 210 280 220 330 L 180 400 Z" fill="#d4b483" stroke="#b08d57" stroke-width="1.5" />
    <path d="M 110 260 L 110 370 L 150 370 L 150 260 Z" fill="#fdfbf7" />
    <!-- Pocket Pen -->
    <rect x="165" y="300" width="6" height="24" rx="2" fill="#1e293b" />
    <rect x="166" y="296" width="4" height="4" fill="#d97706" />
    
    <!-- Neck -->
    <rect x="115" y="220" width="30" height="45" fill="#fcd3b8" />
    <!-- Face -->
    <path d="M 100 160 C 100 120 160 120 160 160 C 160 210 100 210 100 160 Z" fill="#fcd3b8" />
    <!-- Hair & White Beard -->
    <path d="M 98 150 C 95 120 165 120 162 150 C 165 140 160 130 130 130 C 100 130 95 140 98 150 Z" fill="#ffffff" />
    <path d="M 96 170 C 92 230 168 230 164 170 C 158 200 152 215 130 215 C 108 215 102 200 96 170 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <!-- Moustache -->
    <path d="M 112 182 Q 130 178 148 182 Q 130 192 112 182 Z" fill="#ffffff" />
    <!-- Spectacles -->
    <rect x="108" y="152" width="16" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="2" />
    <rect x="136" y="152" width="16" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="2" />
    <line x1="124" y1="158" x2="136" y2="158" stroke="#64748b" stroke-width="2" />
    <!-- Dignified Smile -->
    <path d="M 122 190 Q 130 196 138 190" fill="none" stroke="#b45309" stroke-width="1.5" />
    <!-- Label -->
    <text x="130" y="420" font-size="12" font-weight="bold" fill="#072640" text-anchor="middle" font-family="'Noto Sans', sans-serif">
      Shri Narendra Modi
    </text>
    <text x="130" y="435" font-size="10" fill="#64748b" text-anchor="middle" font-family="'Noto Sans', sans-serif">
      Hon'ble Prime Minister of India
    </text>
  </g>

  <!-- 6. Gateway of India (Right Background) -->
  <g transform="translate(1220, 90) scale(0.65)" opacity="0.85">
    <!-- Basalt Arch Structure -->
    <rect x="50" y="240" width="220" height="90" fill="#d97706" opacity="0.2" />
    <!-- Main Central Archway -->
    <path d="M 110 330 L 110 240 Q 160 170 210 240 L 210 330 Z" fill="#ffffff" opacity="0.9" stroke="#92400e" stroke-width="2" />
    <!-- Side Turrets -->
    <rect x="50" y="190" width="35" height="140" fill="#92400e" opacity="0.3" />
    <rect x="235" y="190" width="35" height="140" fill="#92400e" opacity="0.3" />
    <!-- Turret Domes -->
    <path d="M 45 190 Q 67 150 90 190 Z" fill="#92400e" opacity="0.4" />
    <path d="M 230 190 Q 252 150 275 190 Z" fill="#92400e" opacity="0.4" />
    <!-- Central Crown Screen -->
    <rect x="85" y="160" width="150" height="40" fill="#92400e" opacity="0.35" />
    <!-- Water Waves of Arabian Sea -->
    <path d="M 20 330 Q 80 320 140 330 T 260 330 T 320 330" fill="none" stroke="#0ea5e9" stroke-width="3" opacity="0.5" />
    <path d="M 0 340 Q 70 335 150 340 T 300 340" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.4" />
  </g>

  <!-- 7. Hon. Devendra Fadnavis (Right Foreground Portrait) -->
  <g transform="translate(1180, 110) scale(0.92)">
    <!-- Body: White Kurta & Dark Navy Nehru Waistcoat -->
    <path d="M 100 390 L 60 320 C 70 270 110 250 150 250 C 190 250 230 270 240 320 L 200 390 Z" fill="#0f2942" stroke="#071b2d" stroke-width="1.5" />
    <path d="M 130 250 L 130 350 L 170 350 L 170 250 Z" fill="#ffffff" />
    <circle cx="150" cy="275" r="2.5" fill="#e2e8f0" />
    <circle cx="150" cy="300" r="2.5" fill="#e2e8f0" />
    <circle cx="150" cy="325" r="2.5" fill="#e2e8f0" />
    <!-- Folded Arms -->
    <path d="M 80 340 C 90 310 210 310 220 340 C 200 365 100 365 80 340 Z" fill="#0f2942" stroke="#1e3a5f" stroke-width="1" />
    <rect x="70" y="320" width="30" height="25" rx="5" fill="#ffffff" />
    <rect x="200" y="320" width="30" height="25" rx="5" fill="#ffffff" />
    
    <!-- Neck -->
    <rect x="135" y="210" width="30" height="45" fill="#fcd3b8" />
    <!-- Face -->
    <path d="M 120 150 C 120 110 180 110 180 150 C 180 200 120 200 120 150 Z" fill="#fcd3b8" />
    <!-- Dark Hair -->
    <path d="M 118 140 C 115 105 185 105 182 140 C 185 130 180 120 150 120 C 120 120 115 130 118 140 Z" fill="#1e293b" />
    <!-- Moustache -->
    <path d="M 134 175 Q 150 170 166 175 Q 150 184 134 175 Z" fill="#1e293b" />
    <!-- Eyes & Confident Smile -->
    <circle cx="138" cy="150" r="2" fill="#0f172a" />
    <circle cx="162" cy="150" r="2" fill="#0f172a" />
    <path d="M 140 182 Q 150 188 160 182" fill="none" stroke="#991b1b" stroke-width="1.5" />
    <!-- Label -->
    <text x="150" y="410" font-size="12" font-weight="bold" fill="#072640" text-anchor="middle" font-family="'Noto Sans', sans-serif">
      Shri Devendra Fadnavis
    </text>
    <text x="150" y="425" font-size="10" fill="#64748b" text-anchor="middle" font-family="'Noto Sans', sans-serif">
      Hon'ble Leader &amp; Deputy CM, Maharashtra
    </text>
  </g>

</svg>
